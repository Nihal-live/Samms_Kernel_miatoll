name: Build SKYNET kernel via KernelSU_Action_V2

# Second, independent build path.
#
# build-kernel-sukisu.yml is this repo's own pipeline. This one goes through
# Nihal-live/KernelSU_Action_V2 instead: same kernel, same SukiSU-Nova tree,
# same KPM step, but the action's scripts do the work, which is what its
# verbose per-step logging and RUNNER_DEBUG switch are for.
#
# The action needs three small additions for this tree (a samms-nova variant,
# KPM allowed for it, and the KPM step delegating to scripts/kpm-patch.sh).
# They live in ci/ksu-action-v2/miatoll.patch and are applied here, because
# this repository has no write access to the action's repository. Nothing else
# about the action changes -- its scripts still do every step.

on:
  # A workflow_dispatch-only workflow is not dispatchable from a branch until
  # the file exists on the default branch, so a push to the files this pipeline
  # is made of starts a run too.
  push:
    paths:
      - "ci/ksu-action-v2/**"
      - ".github/workflows/build-with-ksu-action.yml"
  workflow_dispatch:
    inputs:
      action_ref:
        description: "KernelSU_Action_V2 commit to build with"
        required: false
        default: 26c1b95532549d4cb57ab152f5650003d89c6efb
      config:
        description: "Device profile inside the action tree"
        required: false
        default: config/miatoll.env
      debug:
        description: "Verbose script output (RUNNER_DEBUG)"
        type: boolean
        required: false
        default: true

# contents: write is for the stage-log branch; nothing else is pushed.
permissions:
  contents: write

concurrency:
  group: ksu-action-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build miatoll via KernelSU_Action_V2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ inputs.config || 'config/miatoll.env' }}
      ACTION_DIR: ${{ github.workspace }}/ksu-action
      LOG_DIR: ${{ github.workspace }}/ksu-action-logs
      ACTION_REF: ${{ inputs.action_ref || '26c1b95532549d4cb57ab152f5650003d89c6efb' }}
      # Verbose per-step output from the action's own logging helpers. The
      # "debug" input exists only to be explicit; verbose is the default here
      # because that logging is the reason this pipeline is kept.
      RUNNER_DEBUG: "1"
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Fetch KernelSU_Action_V2 at the pinned commit
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Nihal-live/KernelSU_Action_V2 \
            "$ACTION_DIR"
          git -C "$ACTION_DIR" checkout --quiet "$ACTION_REF"
          echo "action commit: $(git -C "$ACTION_DIR" rev-parse HEAD)"
          # The patch is generated against this exact commit; if the action's
          # scripts moved, refusing here beats applying a fuzzy patch to a
          # build engine whose internals we then no longer understand.
          git -C "$ACTION_DIR" apply --check --verbose \
            "$GITHUB_WORKSPACE/ci/ksu-action-v2/miatoll.patch"
          git -C "$ACTION_DIR" apply \
            "$GITHUB_WORKSPACE/ci/ksu-action-v2/miatoll.patch"
          echo "::group::Patch applied"
          git -C "$ACTION_DIR" --no-pager diff --stat
          echo "::endgroup::"

      - name: Verify the patched action before it runs
        run: |
          set -euo pipefail
          cd "$ACTION_DIR"
          # Fail before a 40-minute build, not after it.
          grep -q 'samms-nova)' scripts/kernelsu.sh \
            || { echo "::error::samms-nova variant missing"; exit 1; }
          grep -q 'samms-nova' scripts/config.sh \
            || { echo "::error::ENABLE_KPM is still restricted"; exit 1; }
          grep -q "kpm-patch.sh" scripts/patches.sh \
            || { echo "::error::KPM delegation missing"; exit 1; }
          test -f "$CONFIG_ENV" \
            || { echo "::error::$CONFIG_ENV does not exist"; exit 1; }
          bash -n scripts/*.sh
          echo "patched action looks consistent"

      - name: Resolve configuration
        run: bash "$GITHUB_WORKSPACE/ci/ksu-action-v2/run-stage.sh" config
        working-directory: ${{ github.workspace }}/ksu-action

      - name: Free up disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev
          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash "$GITHUB_WORKSPACE/ci/ksu-action-v2/run-stage.sh" toolchain
        working-directory: ${{ github.workspace }}/ksu-action

      - name: Fetch kernel source
        run: bash "$GITHUB_WORKSPACE/ci/ksu-action-v2/run-stage.sh" source
        working-directory: ${{ github.workspace }}/ksu-action

      - name: Install KernelSU
        if: env.KSU_VARIANT != 'none'
        run: bash "$GITHUB_WORKSPACE/ci/ksu-action-v2/run-stage.sh" kernelsu
        working-directory: ${{ github.workspace }}/ksu-action

      - name: Apply kernel patches
        run: bash "$GITHUB_WORKSPACE/ci/ksu-action-v2/run-stage.sh" patches all
        working-directory: ${{ github.workspace }}/ksu-action

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ksu-action-miatoll-${{ env.KSU_VARIANT }}-${{ env.KERNEL_VERSION }}
          max-size: 2G

      - name: Build kernel
        run: bash "$GITHUB_WORKSPACE/ci/ksu-action-v2/run-stage.sh" build all
        working-directory: ${{ github.workspace }}/ksu-action

      - name: Package artifacts
        run: bash "$GITHUB_WORKSPACE/ci/ksu-action-v2/run-stage.sh" package all
        working-directory: ${{ github.workspace }}/ksu-action

      - name: Export build metadata
        id: meta
        run: |
          set -euo pipefail
          BOOT="$WORKSPACE/android-kernel/out/arch/arm64/boot"
          {
            echo "device=${DEVICE:-miatoll}"
            echo "build_time=$(date -u +%Y%m%d-%H%M)"
            echo "ksu_name=${KSU_NAME:-SukiSU-Nova}"
          } >> "$GITHUB_OUTPUT"
          echo "::group::Boot artefacts"
          ls -l "$BOOT"
          echo "::endgroup::"
          # Same two facts the repo's own workflow asserts: the kernel side of
          # KPM is compiled in, and the image really carries KernelPatch.
          grep -q '^CONFIG_KPM=y' "$WORKSPACE/android-kernel/out/.config" \
            || { echo "::error::CONFIG_KPM did not survive the build"; exit 1; }
          strings "$BOOT/Image" | grep -q 'KernelPatch Version' \
            || { echo "::error::Image is not patched for KPM"; exit 1; }
          echo "KPM: compiled in and injected"

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: ksu-action-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.build_time }}
          path: |
            ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/Image
            ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
            ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
          retention-days: 14

      - name: Zip the AnyKernel3 package
        # package.sh assembles AnyKernel3/ but leaves it unpacked; a flashable
        # zip is what a phone wants.
        run: |
          set -euo pipefail
          AK3="$WORKSPACE/AnyKernel3"
          [ -d "$AK3" ] || { echo "no AnyKernel3 directory was assembled"; exit 0; }
          ( cd "$AK3" && zip -qr "$WORKSPACE/AnyKernel3-${{ steps.meta.outputs.device }}.zip" . )
          ls -l "$WORKSPACE/AnyKernel3-${{ steps.meta.outputs.device }}.zip"

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ksu-action-AnyKernel3-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.build_time }}
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel3-*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Publish stage logs to a branch on failure
        # Same reason as the other pipeline: the job log and the artefact zip
        # are served from storage that not every client can reach, and a
        # failed stage is exactly when the text matters. A throwaway branch is
        # reachable with plain git.
        if: failure()
        run: |
          set -euo pipefail
          [ -d "$LOG_DIR" ] || { echo "no stage logs captured"; exit 0; }
          mkdir -p /tmp/ci-action-log
          {
            echo "# KernelSU_Action_V2 stage logs for run $GITHUB_RUN_ID"
            echo
            echo "commit ${GITHUB_SHA}, action ${ACTION_REF}"
            for f in "$LOG_DIR"/*.log; do
              [ -f "$f" ] || continue
              echo
              echo "## $(basename "$f")"
              echo
              echo '```'
              tail -n 200 "$f"
              echo '```'
            done
          } > /tmp/ci-action-log/stage-logs.md
          cd /tmp/ci-action-log
          git init -q .
          git checkout -q -b ci-action-log
          git config user.name  "skynet-ci"
          git config user.email "ci@users.noreply.github.com"
          git add stage-logs.md
          git commit -q -m "ci: KernelSU_Action_V2 stage logs for $GITHUB_RUN_ID"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            ci-action-log
          echo "pushed to branch ci-action-log"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksu-action-logs-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/ksu-action-logs
            ${{ github.workspace }}/kernel_workspace/android-kernel/out/.config
          if-no-files-found: ignore
          retention-days: 7
