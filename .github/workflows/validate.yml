name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Docs and scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Only the SKYNET helper scripts are checked. After the source is
      # flattened, scripts/ also contains the kernel's own build scripts,
      # which are not ours to lint.
      - name: Shell syntax and executable bits
        run: |
          set -euo pipefail
          for f in scripts/build.sh scripts/verify-source.sh \
                   scripts/package-anykernel.sh scripts/ksu-nova-setup.sh; do
            bash -n "$f"
            test -x "$f" || { echo "not executable: $f"; exit 1; }
          done

      - name: ShellCheck (errors)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/build.sh scripts/verify-source.sh \
            scripts/package-anykernel.sh scripts/ksu-nova-setup.sh

      - name: In-tree source and documentation pin
        run: ./scripts/verify-source.sh

      - name: Markdown links
        run: python3 scripts/check-links.py

  integration:
    name: SukiSU-Nova integration (dry run)
    # Applies the integration to a clean checkout and checks the result. No
    # kernel is built here -- this catches a moved upstream ref, a changed
    # anchor in SukiSU-Nova, or a hook that landed in the wrong function, in
    # about a minute instead of after a 40-minute build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply integration
        run: ./scripts/ksu-nova-setup.sh

      - name: Assert what was applied
        run: |
          set -euo pipefail
          test -L drivers/kernelsu
          grep -qE '^obj-\$\(CONFIG_KSU\) \+= kernelsu/$' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          # Hooks: one call per site, and setresuid's call inside setresuid().
          # Exactly one *call* per site. Counting every mention would also
          # count the extern declaration at column 0.
          for f in fs/exec.c kernel/reboot.c kernel/sys.c drivers/input/input.c \
                   fs/open.c fs/stat.c; do
            test "$(grep -cE '^[[:space:]]+ksu_handle_[a-z_]+\(' "$f")" -eq 1
          done
          # The call sits after the local declarations, so scan the function
          # body between syscall definitions rather than a fixed line count.
          awk '/^SYSCALL_DEFINE3\(setresuid,/{f=1;next} /^SYSCALL_DEFINE/{f=0}
               f && /ksu_handle_setresuid\(/{found=1} END{exit !found}' kernel/sys.c
          if awk '/^SYSCALL_DEFINE2\(setregid,/{f=1;next} /^SYSCALL_DEFINE/{f=0}
                  f && /ksu_handle_setresuid\(/{found=1} END{exit !found}' kernel/sys.c; then
            echo "::error::setresuid hook landed in setregid()"; exit 1
          fi

          # The two Nova 4.14 fixes must be present.
          grep -q 'KSU_CAN_USE_KPM' KernelSU/kernel/kernel_compat.h
          grep -B1 '#include <linux/static_call.h>' KernelSU/kernel/kernel_includes.h \
            | grep -q 'KERNEL_VERSION(5, 10, 0)'

          # SUSFS and KPM must not be enabled by a build that excludes them.
          if grep -qE '^CONFIG_KSU_SUSFS' \
               arch/arm64/configs/vendor/xiaomi/miatoll_defconfig; then
            echo "::error::SUSFS is enabled in a build that must not have it"; exit 1
          fi
          grep -qx 'CONFIG_KSU=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          grep -qx '# CONFIG_KPM is not set' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          echo "integration applied as expected"

      - name: Re-run is read-only
        run: |
          set -euo pipefail
          BEFORE=$(git status --porcelain=v1 | sort | sha256sum)
          ./scripts/ksu-nova-setup.sh
          ./scripts/ksu-nova-setup.sh --check
          AFTER=$(git status --porcelain=v1 | sort | sha256sum)
          test "$BEFORE" = "$AFTER" || {
            echo "::error::re-run changed the working tree"; git status --porcelain; exit 1; }
          echo "re-run and --check are read-only"
