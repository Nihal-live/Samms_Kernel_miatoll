name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Docs and scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Only the SKYNET helper scripts are checked. After the source is
      # flattened, scripts/ also contains the kernel's own build scripts,
      # which are not ours to lint.
      - name: Shell syntax and executable bits
        run: |
          set -euo pipefail
          for f in scripts/build.sh scripts/verify-source.sh \
                   scripts/package-anykernel.sh scripts/ksu-nova-setup.sh; do
            bash -n "$f"
            test -x "$f" || { echo "not executable: $f"; exit 1; }
          done

      - name: ShellCheck (errors)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/build.sh scripts/verify-source.sh \
            scripts/package-anykernel.sh scripts/ksu-nova-setup.sh

      - name: In-tree source and documentation pin
        run: ./scripts/verify-source.sh

      - name: SUSFS patch applies to a clean tree
        run: |
          set -euo pipefail
          git apply --check --whitespace=nowarn patches/susfs/susfs-4.14-v2.4.0.patch
          echo "patch applies with zero fuzz"

      - name: Markdown links
        run: python3 scripts/check-links.py

  integration:
    name: SukiSU-Nova + SUSFS integration (dry run)
    # Applies the whole integration to a clean checkout and checks the result.
    # No kernel is built here -- this catches a moved upstream ref, a changed
    # anchor in SukiSU-Nova, or a patch that no longer applies, in about a
    # minute instead of after a 40-minute build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply integration
        run: ./scripts/ksu-nova-setup.sh

      - name: Assert what was applied
        run: |
          set -euo pipefail
          grep -q 'susfs' fs/Makefile
          test -f fs/susfs.c
          test -f include/linux/susfs_def.h
          grep -q 'ksu_handle' fs/exec.c
          grep -q 'ksu_handle' kernel/sys.c
          grep -q 'ksu_handle' kernel/reboot.c
          grep -q 'ksu_handle' drivers/input/input.c
          # The faccessat/stat hooks are deliberately absent: see docs/KSU-SUSFS.md.
          ! grep -q 'ksu_handle_faccessat\|ksu_handle_stat' fs/open.c fs/stat.c
          grep -qx 'CONFIG_KSU=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          grep -qx 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          test -L drivers/kernelsu
          echo "integration applied as expected"

      - name: Re-run is read-only
        run: |
          set -euo pipefail
          BEFORE=$(git status --porcelain=v1 | sort | sha256sum)
          ./scripts/ksu-nova-setup.sh --check
          AFTER=$(git status --porcelain=v1 | sort | sha256sum)
          test "$BEFORE" = "$AFTER" || {
            echo "::error::--check changed the working tree"; git status --porcelain; exit 1; }
          echo "--check is read-only"
