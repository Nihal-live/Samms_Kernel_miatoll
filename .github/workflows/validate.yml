name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Docs and scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Only the SKYNET helper scripts are checked. After the source is
      # flattened, scripts/ also contains the kernel's own build scripts,
      # which are not ours to lint.
      - name: Shell syntax and executable bits
        run: |
          set -euo pipefail
          for f in scripts/build.sh scripts/verify-source.sh \
                   scripts/package-anykernel.sh scripts/ksu-nova-setup.sh; do
            bash -n "$f"
            test -x "$f" || { echo "not executable: $f"; exit 1; }
          done

      - name: ShellCheck (errors)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/build.sh scripts/verify-source.sh \
            scripts/package-anykernel.sh scripts/ksu-nova-setup.sh

      - name: In-tree source and documentation pin
        run: ./scripts/verify-source.sh

      - name: Markdown links
        run: python3 scripts/check-links.py

  susfs-integration:
    name: SUSFS v2.3.0 integration (dry run)
    # The SUSFS build is a separate product, so it gets its own dry run: it
    # applies the same two-patch stack a real build would, on a clean checkout,
    # and checks the result. A rejected hunk, a missing shim or an idr.h-style
    # API mismatch shows up here in a minute instead of after a 40-minute
    # build -- and, on a device, instead of as a bootloop.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply integration with SUSFS
        run: KSU_SUSFS=1 ./scripts/ksu-nova-setup.sh

      - name: Assert what was applied
        run: |
          set -euo pipefail
          # No rejected hunks anywhere: a fuzz-3 patch that lands in the wrong
          # place is the failure mode this whole job exists to catch.
          test -z "$(find fs include kernel mm security -name '*.rej' -print -quit)"

          # The three SUSFS sources and the shim.
          test -s fs/susfs.c
          grep -q 'susfs_mnt_id_backup' include/linux/mount.h
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs_compat.o' fs/Makefile

          # The four v2.4 entry points SukiSU-Nova calls and v2.3.0 lacks, plus
          # susfs_ends_with() (v2.3.0 ships only the mirror) and the AVC flag.
          for sym in susfs_add_sus_type susfs_add_sus_avd_allowed_by_type \
                     susfs_set_current_proc_no_su \
                     susfs_set_current_proc_umounted_for_zygote_next \
                     susfs_ends_with susfs_is_avc_log_spoofing_enabled; do
            grep -q "$sym" fs/susfs_compat.c \
              || { echo "::error::fs/susfs_compat.c does not provide $sym"; exit 1; }
          done
          grep -q 'susfs_ends_with' include/linux/susfs.h \
            || { echo "::error::susfs_ends_with() is not declared for Nova"; exit 1; }

          # The 4.14 IDA allocator survives: the port adds a branch, it does
          # not replace ida_pre_get()/ida_get_new_above() with the 4.19 API.
          # (lib/idr.c does carry ida_alloc_range() on this tree, so the check
          # has to be about the call site, not the helper's existence.)
          grep -q 'ida_pre_get' fs/super.c \
            || { echo "::error::get_anon_bdev() lost the 4.14 IDA API"; exit 1; }
          if grep -q 'ida_alloc_range' fs/super.c; then
            echo "::error::get_anon_bdev() was switched to a 4.19+ IDA call"; exit 1
          fi

          # What the build enables, and what it must not.
          grep -qx 'CONFIG_KSU_SUSFS=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          grep -qx 'CONFIG_KSU_SUSFS_SUS_PATH=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          for sym in SUS_MAP OPEN_REDIRECT PRIORITY_UID_FILTER; do
            grep -qx "# CONFIG_KSU_SUSFS_$sym is not set" \
                 arch/arm64/configs/vendor/xiaomi/miatoll_defconfig \
              || { echo "::error::CONFIG_KSU_SUSFS_$sym must stay off"; exit 1; }
          done

          # SUSFS owns the AVC supercall in this build, so reboot() must not
          # answer it; the avc_dump_query() rewrite is still ours.
          if grep -q 'ksu_avc_spoof_reboot' kernel/reboot.c; then
            echo "::error::reboot() answers a supercall SUSFS now owns"; exit 1
          fi
          grep -q 'ksu_avc_log_spoof_matches(tsid)' security/selinux/avc.c \
            || { echo "::error::avc_dump_query() has no AVC log spoofing"; exit 1; }

          # The uname spoof has to sit inside newuname(), where sys.c's own
          # fake-uname block also lives -- an anchor miss here is silent.
          awk 'BEGIN{f=0;found=0}
               /^SYSCALL_DEFINE/ { if (f) exit; if (index($0, "(newuname,")) f=1; next }
               f && index($0, "susfs_spoof_uname(") { found=1 }
               END { exit !found }' kernel/sys.c \
            || { echo "::error::susfs_spoof_uname() is not in newuname()"; exit 1; }

          # ksu_handle_setresuid() only exists in this flavour, so it must be
          # hooked now -- inside setresuid(), not setregid().
          grep -q 'ksu_handle_setresuid' kernel/sys.c \
            || { echo "::error::the SUSFS build must hook setresuid"; exit 1; }
          if awk 'BEGIN{f=0;found=0}
                  /^SYSCALL_DEFINE/ { if (f) exit; if (index($0, "(setregid,")) f=1; next }
                  f && index($0, "ksu_handle_setresuid(") { found=1 }
                  END { exit !found }' kernel/sys.c; then
            echo "::error::setresuid hook landed in setregid()"; exit 1
          fi

          # KPM must still be on: SUSFS does not replace it.
          grep -qx 'CONFIG_KPM=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          echo "SUSFS v2.3.0 integration verified"

  integration:
    name: SukiSU-Nova integration (dry run)
    # Applies the integration to a clean checkout and checks the result. No
    # kernel is built here -- this catches a moved upstream ref, a changed
    # anchor in SukiSU-Nova, or a hook that landed in the wrong function, in
    # about a minute instead of after a 40-minute build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply integration
        run: ./scripts/ksu-nova-setup.sh

      - name: Assert what was applied
        run: |
          set -euo pipefail
          test -L drivers/kernelsu
          grep -qE '^obj-\$\(CONFIG_KSU\) \+= kernelsu/$' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          # Hooks: one call per site, and setresuid's call inside setresuid().
          # Hooks: at most one call per site, and the execve hook (what `su`
          # rides on) must be there. kernel/sys.c is legitimately empty:
          # ksu_handle_setresuid() only exists in the SUSFS build, so the
          # setup script skips that hook.
          for f in fs/exec.c kernel/reboot.c kernel/sys.c drivers/input/input.c \
                   fs/open.c fs/stat.c; do
            # grep -c exits 1 on zero matches; the zero case is expected here.
            n=$(grep -cE '^[[:space:]]+ksu_handle_[a-z_]+\(' "$f" || true)
            test "$n" -le 1 || { echo "::error::duplicate hook in $f"; exit 1; }
          done
          test "$(grep -cE '^[[:space:]]+ksu_handle_[a-z_]+\(' fs/exec.c || true)" -eq 1
          for f in fs/exec.c kernel/reboot.c drivers/input/input.c fs/open.c fs/stat.c; do
            test "$(grep -cE '^[[:space:]]+ksu_handle_[a-z_]+\(' "$f" || true)" -eq 1 \
              || { echo "::error::hook missing in $f"; exit 1; }
          done
          # A hook is only inserted when the symbol is really defined; if it is,
          # it must not be in the neighbouring setregid().
          if grep -q 'ksu_handle_setresuid' kernel/sys.c; then
            awk 'BEGIN{f=0;found=0}
                 /^SYSCALL_DEFINE/ { if (f) exit; if (index($0, "(setresuid,")) f=1; next }
                 f && index($0, "ksu_handle_setresuid(") { found=1 }
                 END { exit !found }' kernel/sys.c
            if awk 'BEGIN{f=0;found=0}
                    /^SYSCALL_DEFINE/ { if (f) exit; if (index($0, "(setregid,")) f=1; next }
                    f && index($0, "ksu_handle_setresuid(") { found=1 }
                    END { exit !found }' kernel/sys.c; then
              echo "::error::setresuid hook landed in setregid()"; exit 1
            fi
          fi

          # The two Nova 4.14 fixes must be present.
          grep -q 'KSU_CAN_USE_KPM' KernelSU/kernel/kernel_compat.h
          grep -B1 '#include <linux/static_call.h>' KernelSU/kernel/kernel_includes.h \
            | grep -q 'KERNEL_VERSION(5, 10, 0)'

          # SUSFS and KPM must not be enabled by a build that excludes them.
          if grep -qE '^CONFIG_KSU_SUSFS' \
               arch/arm64/configs/vendor/xiaomi/miatoll_defconfig; then
            echo "::error::SUSFS is enabled in a build that must not have it"; exit 1
          fi
          grep -qx 'CONFIG_KSU=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          grep -qx 'CONFIG_KPM=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig
          # 4.14 ports of upstream-5.10-only code must actually be applied.
          grep -q 'KERNEL_VERSION(4, 14, 0)' KernelSU/kernel/kernel_compat.h \
            || { echo "::error::cpu_spoof gate is not lowered to 4.14"; exit 1; }
          grep -q 'asm/vdso_datapage.h' KernelSU/kernel/extension/cpu_spoof.c \
            || { echo "::error::cpu_spoof lost its pre-4.18 datapage include"; exit 1; }
          grep -q '< KERNEL_VERSION(4, 18, 0)' KernelSU/kernel/extension/cpu_spoof.c \
            || { echo "::error::cpu_spoof lost its pre-4.18 vDSO guard"; exit 1; }
          echo "cpu_spoof ported to 4.14"

          # SELinux hiding + AVC log spoofing must be wired, not just
          # documented: both are re-implemented for 4.14 without SUSFS.
          grep -q 'ksu_hide_compat.o' security/selinux/Makefile \
            || { echo "::error::ksu_hide_compat.o is not built"; exit 1; }
          grep -q 'ksu_avc_log_spoof_matches(tsid)' security/selinux/avc.c \
            || { echo "::error::avc_dump_query() has no AVC log spoofing"; exit 1; }
          grep -q 'ksu_selinux_hide_read_policy' security/selinux/ss/services.c \
            || { echo "::error::security_read_policy() serves the live policy"; exit 1; }
          grep -q 'ksu_avc_spoof_reboot' kernel/reboot.c \
            || { echo "::error::reboot() does not answer the SUSFS supercall"; exit 1; }
          grep -q 'selinux_hide_414.c' KernelSU/kernel/ksu_main.c \
            || { echo "::error::SukiSU still skips selinux_hide on 4.14"; exit 1; }
          echo "selinux_hide + avc log spoofing wired for 4.14"
          # KPM: enabled in the defconfig and its three 4.14 ports applied.
          grep -qx 'CONFIG_KPM=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig \
            || { echo "::error::defconfig does not enable CONFIG_KPM"; exit 1; }
          grep -q 'VERIFY_WRITE' KernelSU/kernel/extension/kpm/kpm.c \
            || { echo "::error::KPM lost its pre-5.0 access_ok() form"; exit 1; }
          grep -q 'KSU_TASK_HAS_THREAD_PID' KernelSU/kernel/Makefile \
            || { echo "::error::the clone Makefile does not define KSU_TASK_HAS_THREAD_PID"; exit 1; }
          test -x scripts/kpm-patch.sh \
            || { echo "::error::scripts/kpm-patch.sh missing or not executable"; exit 1; }
          echo "KPM enabled and ported"
          echo "integration applied as expected"

      - name: Re-run is read-only
        run: |
          set -euo pipefail
          BEFORE=$(git status --porcelain=v1 | sort | sha256sum)
          ./scripts/ksu-nova-setup.sh
          ./scripts/ksu-nova-setup.sh --check
          AFTER=$(git status --porcelain=v1 | sort | sha256sum)
          test "$BEFORE" = "$AFTER" || {
            echo "::error::re-run changed the working tree"; git status --porcelain; exit 1; }
          echo "re-run and --check are read-only"
