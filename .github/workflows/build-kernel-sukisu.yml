name: Build SKYNET kernel + SukiSU Nova + SUSFS (AnyKernel3 ZIP)

# Builds the miatoll/excalibur 4.14.357 kernel with SukiSU Nova embedded at
# kernel level AND SUSFS v2.3.0 root-hiding, then packages a flashable
# AnyKernel3 ZIP.
#
# The whole integration is applied by scripts/sukisu-setup.sh on every run, so
# the build is reproducible from a clean checkout -- nothing depends on a local
# working tree. The files that need to be committed are:
#   scripts/sukisu-setup.sh
#   scripts/susfs_414_reconcile.py   (stage 6: bridge v1.5.5 patch -> v2.3.0 core)
#   .github/workflows/build-kernel-sukisu.yml

on:
  workflow_dispatch:
    inputs:
      clang_repo:
        description: Prebuilt Clang/LLD repository
        required: true
        default: https://github.com/kdrag0n/proton-clang.git
      clang_ref:
        description: Branch or tag of the Clang repository
        required: true
        default: master
      target:
        description: Kernel make target
        required: true
        default: Image.gz-dtb
      release_tag:
        description: Optional tag for a GitHub Release (empty = artifact only)
        required: false
        default: ''
      no_polly:
        description: Disable CONFIG_LLVM_POLLY (needed for toolchains without Polly)
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      susfs_disable:
        description: Space-separated SUSFS symbols to disable (bisect; empty = full SUSFS)
        required: false
        default: ''
      ksu_no_preinit:
        description: "'true' drops the SukiSU preinit runner (SUSFS-only PID 1 execve swap); CONFIG_KSU_SUSFS stays =y"
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    paths:
      - '.github/workflows/build-kernel-sukisu.yml'
      - 'scripts/sukisu-setup.sh'
      - 'scripts/susfs_414_reconcile.py'
      - 'scripts/build.sh'
      - 'scripts/package-anykernel.sh'
      - 'arch/arm64/configs/vendor/xiaomi/miatoll_defconfig'
      - 'anykernel3/**'
    tags:
      - 'skynet-17-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev cpio zip ccache python3 \
            gcc g++ make patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Fetch pinned Clang toolchain
        env:
          CLANG_REPO: ${{ inputs.clang_repo || 'https://github.com/kdrag0n/proton-clang.git' }}
          CLANG_REF: ${{ inputs.clang_ref || 'master' }}
        run: |
          git clone --depth 1 -b "$CLANG_REF" "$CLANG_REPO" "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -n1
          ls "$HOME/clang/bin/ld.lld"

      - name: Apply SukiSU Nova + SUSFS integration
        env:
          SUSFS_DISABLE: ${{ inputs.susfs_disable || '' }}
          KSU_NO_PREINIT: ${{ inputs.ksu_no_preinit == 'true' && '1' || '0' }}
        run: |
          chmod +x scripts/sukisu-setup.sh
          ./scripts/sukisu-setup.sh
          echo "--- KSU wiring ---"
          ls -l drivers/kernelsu
          tail -2 drivers/Makefile
          grep -n 'kernelsu' drivers/Kconfig
          echo "--- KSU hooks ---"
          grep -c 'ksu_handle' fs/exec.c fs/open.c kernel/reboot.c kernel/sys.c drivers/input/input.c
          echo "--- SUSFS wiring ---"
          grep -n 'susfs' fs/Makefile
          grep -E '^#define SUSFS_VERSION' include/linux/susfs.h
          grep -c 'SUSFS_414_COMPAT' include/linux/susfs_def.h

      - name: Verify in-tree source
        run: ./scripts/verify-source.sh

      - name: Configure and build
        env:
          TARGET: ${{ inputs.target || 'Image.gz-dtb' }}
          NO_POLLY: ${{ inputs.no_polly || 'true' }}
          SUSFS_DISABLE: ${{ inputs.susfs_disable || '' }}
        run: |
          EXTRA=()
          if [ "$NO_POLLY" = "true" ]; then EXTRA+=(--no-polly); fi
          ./scripts/build.sh --clang-dir "$HOME/clang/bin" \
            --jobs "$(nproc)" --target "$TARGET" "${EXTRA[@]}"

          echo "--- CONFIG_KSU / SUSFS in generated .config ---"
          grep -E '^CONFIG_(KSU|KALLSYMS|KPROBES)' out/.config || {
            echo "::error::CONFIG_KSU did not survive into .config"; exit 1; }
          if [[ " ${SUSFS_DISABLE:-} " != *" CONFIG_KSU_SUSFS "* ]]; then
            grep -E '^CONFIG_KSU_SUSFS' out/.config || {
              echo "::error::CONFIG_KSU_SUSFS did not survive into .config"; exit 1; }
            if ! grep -qx 'CONFIG_KSU_SUSFS=y' out/.config; then
              echo "::error::CONFIG_KSU_SUSFS is not =y"; exit 1
            fi
          else
            echo "CONFIG_KSU_SUSFS disabled via susfs_disable input; skipping SUSFS checks"
          fi

          echo "--- kernel.release ---"
          REL="$(cat out/include/config/kernel.release 2>/dev/null || printf 'unknown')"
          echo "$REL"
          case "$REL" in
            *SKYNET*) ;;
            *) echo "::error::kernel.release does not contain SKYNET: $REL"; exit 1 ;;
          esac
          echo "--- boot artefacts ---"
          ls -lh out/arch/arm64/boot/ || true

      - name: Package AnyKernel3 ZIP
        id: package
        run: |
          NAME="skynet-17-sukisu-susfs-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          ./scripts/package-anykernel.sh --name "$NAME" \
            --out "$GITHUB_WORKSPACE/$NAME.zip"
          sha256sum "$NAME.zip" | tee "$NAME.zip.sha256"
          echo "zip=$NAME.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: skynet-kernel-sukisu-susfs-zip
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: true
          body: |
            ## UNTESTED — hardware validation required

            Kernel with **SukiSU Nova** embedded at kernel level and **SUSFS
            v2.3.0** root-hiding, built by `Build SKYNET kernel + SukiSU Nova +
            SUSFS`.

            **Not boot-tested on any miatoll device.** Back up `boot`, `dtbo`,
            `vendor_boot`, `recovery` and `persist` before flashing, verify the
            device codename and slot layout, and check the attached `.sha256`.

            Install the **SukiSU Nova** manager (`com.sukisu.nova`) — an older
            SukiSU Ultra manager will report "kernel update required".

            SUSFS needs a matching userspace module. Use a `ksu_susfs` build
            that speaks the **v2.3.0** protocol; a v1.5.x module will report
            the kernel as unsupported.
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
