name: Build SKYNET kernel + SukiSU-Nova root (AnyKernel3 ZIP)

# Builds the miatoll 4.14.357 kernel with SukiSU-Nova (`builtin`) embedded at
# kernel level, then packages a flashable AnyKernel3 ZIP.
#
# The whole integration is applied from a clean checkout by
# scripts/ksu-nova-setup.sh on every run, so nothing depends on a local working
# tree and the result is reproducible:
#
#   scripts/ksu-nova-setup.sh -> SukiSU-Nova @ pinned commit, drivers/kernelsu,
#                                the four 4.14 hook call sites, the two Nova
#                                4.14 fixes, and the CONFIG_KSU* symbols
#
# No SUSFS in this flavour; KPM is on and gets a KernelPatch image patch.
# See docs/KSU-NOVA.md.
#
# The build is untested on hardware: the job proves it compiles and that
# CONFIG_KSU actually survived into .config -- not that the resulting kernel
# boots on your device.

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'SukiSU-Nova ref (empty = pinned commit in scripts/ksu-nova-setup.sh)'
        required: false
        default: ''
      clang_repo:
        description: Prebuilt Clang/LLD repository
        required: true
        default: https://github.com/kdrag0n/proton-clang.git
      clang_ref:
        description: Branch or tag of the Clang repository
        required: true
        default: master
      target:
        description: Kernel make target
        required: true
        default: Image.gz-dtb
      release_tag:
        description: Optional tag for a GitHub Release (empty = artifact only)
        required: false
        default: ''
      no_polly:
        description: Disable CONFIG_LLVM_POLLY (needed for toolchains without Polly)
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    paths:
      - '.github/workflows/build-kernel-sukisu.yml'
      - 'scripts/ksu-nova-setup.sh'
      - 'scripts/build.sh'
      - 'scripts/package-anykernel.sh'
      - 'arch/arm64/configs/vendor/xiaomi/miatoll_defconfig'
      - 'anykernel3/**'
    tags:
      - 'skynet-17-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev cpio zip ccache python3 \
            gcc g++ make patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Fetch pinned Clang toolchain
        env:
          CLANG_REPO: ${{ inputs.clang_repo || 'https://github.com/kdrag0n/proton-clang.git' }}
          CLANG_REF: ${{ inputs.clang_ref || 'master' }}
        run: |
          git clone --depth 1 -b "$CLANG_REF" "$CLANG_REPO" "$HOME/clang"
          # A wrong repo/ref does not 404 here -- AOSP-style prebuilt
          # repositories happily serve empty version directories -- so verify
          # the tools exist instead of finding out 40 minutes later.
          "$HOME/clang/bin/clang" --version | head -n1
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip; do
            test -x "$HOME/clang/bin/$tool" \
              || { echo "::error::missing toolchain binary $tool"; exit 1; }
          done
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Apply SukiSU-Nova integration
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          chmod +x scripts/ksu-nova-setup.sh
          ./scripts/ksu-nova-setup.sh
          {
            echo "### SukiSU-Nova"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| SukiSU-Nova | \`$(git -C KernelSU rev-parse HEAD)\` |"
            echo "| defconfig | \`$(grep -cE '^CONFIG_KSU[A-Z_0-9]*=y$' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig) CONFIG_KSU* options\` |"
            echo "| KPM | off |"
            echo "| SUSFS | not included |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect applied tree
        run: |
          echo "--- KSU wiring ---"
          ls -l drivers/kernelsu
          tail -2 drivers/Makefile
          grep -n 'kernelsu' drivers/Kconfig
          echo "--- KSU hooks (call sites per file; kernel/sys.c is expected empty) ---"
          grep -cE '^[[:space:]]+ksu_handle_[a-z_]+\(' fs/exec.c kernel/reboot.c \
                   kernel/sys.c drivers/input/input.c fs/open.c fs/stat.c
          # Every symbol a hooked file calls must be defined in the clone: this
          # is what catches an undefined ksu_handle_* before the linker does.
          for f in fs/exec.c kernel/reboot.c kernel/sys.c drivers/input/input.c \
                   fs/open.c fs/stat.c; do
            for sym in $(sed -nE 's/^[[:space:]]+(ksu_handle_[a-z_]+)\(.*/\1/p' "$f"); do
              grep -rqs "^[A-Za-z_].*[[:space:]*]$sym(" KernelSU/kernel \
                || { echo "::error::$f calls $sym, which the clone does not define"; exit 1; }
            done
          done
          echo "hook symbols all defined"
          awk 'BEGIN{f=0}
               /^SYSCALL_DEFINE/ { if (f) exit; if (index($0, "(setresuid,")) f=1; next }
               f && index($0, "ksu_handle_setresuid(") { print "  " $0 }' kernel/sys.c
          awk 'BEGIN{f=0}
               /^SYSCALL_DEFINE/ { if (f) exit; if (index($0, "(setregid,")) f=1; next }
               f && index($0, "ksu_handle") { print "  UNEXPECTED: " $0 }' kernel/sys.c
          echo "--- cpu_spoof 4.14 port ---"
          # Without these the manager shows CPU identity spoofing as
          # "Unsupported" and the panel cannot be opened, so a silently
          # skipped patch would look like a working build.
          grep -q 'KERNEL_VERSION(4, 14, 0)' KernelSU/kernel/kernel_compat.h \
            || { echo "::error::cpu_spoof gate is not lowered to 4.14"; exit 1; }
          grep -q 'asm/vdso_datapage.h' KernelSU/kernel/extension/cpu_spoof.c \
            || { echo "::error::cpu_spoof lost its pre-4.18 datapage include"; exit 1; }
          grep -q '< KERNEL_VERSION(4, 18, 0)' KernelSU/kernel/extension/cpu_spoof.c \
            || { echo "::error::cpu_spoof lost its pre-4.18 vDSO guard"; exit 1; }
          grep -q '>= KERNEL_VERSION(4, 20, 0)' KernelSU/kernel/extension/cpu_spoof.c \
            || { echo "::error::cpu_spoof lost its elf_hwcap2 guard"; exit 1; }
          echo "cpu_spoof ported to 4.14"
          echo "--- KPM 4.14 ports ---"
          grep -q 'VERIFY_WRITE' KernelSU/kernel/extension/kpm/kpm.c \
            || { echo "::error::KPM lost its pre-5.0 access_ok() form"; exit 1; }
          grep -q 'SUKISU_KPM_NR_TRUNCATE_GUARD' KernelSU/kernel/extension/kpm/kpm.c \
            || { echo "::error::KPM lost the arm64 truncate syscall number"; exit 1; }
          grep -q 'KSU_TASK_HAS_THREAD_PID' KernelSU/kernel/extension/kpm/super_access.c \
            || { echo "::error::super_access.c ignores KSU_TASK_HAS_THREAD_PID"; exit 1; }
          grep -q 'KSU_TASK_HAS_THREAD_PID' KernelSU/kernel/Makefile \
            || { echo "::error::the clone Makefile does not define KSU_TASK_HAS_THREAD_PID"; exit 1; }
          grep -qx 'CONFIG_KPM=y' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig \
            || { echo "::error::defconfig does not enable CONFIG_KPM"; exit 1; }
          echo "KPM ports in place"
          echo "--- defconfig ---"
          grep -E '^CONFIG_KSU|^CONFIG_KALLSYMS|^CONFIG_KPM' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig

      - name: Verify in-tree source
        run: ./scripts/verify-source.sh

      - name: Configure and build
        env:
          TARGET: ${{ inputs.target || 'Image.gz-dtb' }}
          NO_POLLY: ${{ inputs.no_polly || 'true' }}
        run: |
          set -uo pipefail
          EXTRA=()
          if [ "$NO_POLLY" = "true" ]; then EXTRA+=(--no-polly); fi

          LOG="$RUNNER_TEMP/build.log"
          ./scripts/build.sh --clang-dir "$HOME/clang/bin" \
            --jobs "$(nproc)" --target "${TARGET:-Image.gz-dtb}" "${EXTRA[@]}" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Job logs are not reachable from every client, but annotations
            # are. Surface the first real errors as annotations too.
            echo "::error::build.sh exited $rc"
            grep -nE "error:|Error [0-9]+$|undefined reference|No rule to make" "$LOG" \
              | head -8               | while IFS= read -r line; do
                  echo "::error::${line//%/}"
                done
            echo "---- last 40 log lines ----"
            tail -n 40 "$LOG"
            exit "$rc"
          fi

          echo "--- CONFIG_KSU in generated .config ---"
          # An option whose Kconfig dependency is unmet is dropped silently by
          # olddefconfig, which is exactly how you end up shipping a kernel
          # that looks patched and has no root. Assert what the defconfig asks
          # for actually made it.
          grep -E '^CONFIG_(KSU|KALLSYMS)' out/.config || {
            echo "::error::CONFIG_KSU did not survive into .config"; exit 1; }
          while read -r sym; do
            grep -qx "$sym" out/.config || {
              echo "::error::defconfig symbol $sym was dropped from .config"; exit 1; }
          done < <(grep -E '^CONFIG_KSU[A-Z_0-9]*=y$' \
                     arch/arm64/configs/vendor/xiaomi/miatoll_defconfig)
          # KPM is on now, and the post-build step below is what makes it work.
          # An option whose dependency is unmet is dropped silently, so a
          # missing CONFIG_KPM=y would ship a kernel whose KPM panel is dead.
          grep -qx 'CONFIG_KPM=y' out/.config \
            || { echo "::error::CONFIG_KPM=y did not survive olddefconfig"; exit 1; }
          grep -qx 'CONFIG_KALLSYMS_ALL=y' out/.config \
            || { echo "::error::KPM needs CONFIG_KALLSYMS_ALL=y"; exit 1; }
          if grep -q '^CONFIG_KSU_SUSFS' out/.config; then
            echo "::error::SUSFS symbols found but SUSFS is not part of this build"; exit 1
          fi
          echo "CONFIG_KSU and CONFIG_KPM survived; no SUSFS symbols"

          echo "--- kernel.release ---"
          REL="$(cat out/include/config/kernel.release 2>/dev/null || printf 'unknown')"
          echo "$REL"
          case "$REL" in
            *SKYNET*) ;;
            *) echo "::error::kernel.release does not contain SKYNET: $REL"; exit 1 ;;
          esac
          # The extension registers itself with a literal name; if LTO had
          # dropped cpu_spoof the string would be gone and the panel would be
          # unsupported at runtime even though the sources look right.
          strings out/vmlinux | grep -qx 'cpu_spoof' || {
            echo "::error::cpu_spoof extension is not in vmlinux"; exit 1; }
          echo "cpu_spoof extension present in vmlinux"

      - name: Patch image for KPM (KernelPatch)
        # CONFIG_KPM only compiles SukiSU's *bridge*; the loader is
        # KernelPatch, which has to be injected into the built image. This runs
        # patch_linux and rebuilds Image.gz-dtb around the patched Image.
        run: ./scripts/kpm-patch.sh

      - name: Verify KPM patch
        run: |
          set -euo pipefail
          BOOT=out/arch/arm64/boot
          strings "$BOOT/Image" | grep -q 'KernelPatch Version' \
            || { echo "::error::Image does not carry KernelPatch after patching"; exit 1; }
          echo "patched Image: $(stat -c%s "$BOOT/Image") bytes"
          echo "Image.gz-dtb : $(stat -c%s "$BOOT/Image.gz-dtb") bytes"
          ls -lh "$BOOT" | head -20

      - name: Boot artefacts
        run: |
          echo "--- boot artefacts ---"
          ls -lh out/arch/arm64/boot/ || true

      - name: Publish build log to a branch on failure
        # Job logs are served from blob storage, which some clients cannot
        # reach. Pushing the failure text to a throwaway branch keeps it
        # reachable with plain git.
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || { echo "no build log captured"; exit 0; }
          mkdir -p /tmp/ci-log
          {
            echo "# build failure on $(date -u +%FT%TZ) — $(git rev-parse --short HEAD)"
            echo
            echo '```'
            grep -n -B4 -A12 -E "error:|Error [0-9]+$|undefined reference|No rule to make" "$LOG" \
              | head -400 || tail -n 200 "$LOG"
            echo '```'
          } > /tmp/ci-log/build-failure.md
          cd /tmp/ci-log
          git init -q .
          git checkout -q -b ci-build-log
          git config user.name  "skynet-ci"
          git config user.email "ci@users.noreply.github.com"
          git add build-failure.md
          git commit -q -m "ci: build failure log for $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-build-log
          echo "pushed to branch ci-build-log"

      - name: Package AnyKernel3 ZIP
        id: package
        run: |
          NAME="skynet-17-sukisu-nova-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          ./scripts/package-anykernel.sh --name "$NAME" \
            --out "$GITHUB_WORKSPACE/$NAME.zip"
          sha256sum "$NAME.zip" | tee "$NAME.zip.sha256"
          echo "zip=$NAME.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: skynet-kernel-sukisu-nova-zip
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: true
          body: |
            ## UNTESTED — hardware validation required

            Kernel with **SukiSU-Nova** (`builtin`, source-integrated, kernel-level
            root), built by `Build SKYNET kernel + SukiSU-Nova root`.

            | item | value |
            | --- | --- |
            | SukiSU-Nova | committed in `scripts/ksu-nova-setup.sh` (`KSU_REF`) |
            | root hiding | none (no SUSFS in this flavour) |
            | KPM | off |
            | source | `${{ github.sha }}` on `${{ github.ref_name }}` |

            **Not boot-tested on any miatoll device.** Back up `boot`, `dtbo`,
            `vendor_boot`, `recovery` and `persist` before flashing, verify the
            device codename and slot layout, and check the attached `.sha256`.

            Install the **SukiSU-Nova** manager — an older SukiSU Ultra manager
            will report "kernel update required".
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
