name: Build SKYNET kernel + SukiSU-Nova + SUSFS (AnyKernel3 ZIP)

# Builds the miatoll 4.14.357 kernel with SukiSU-Nova (`builtin`) embedded at
# kernel level and SUSFS v2.4.0 root hiding, then packages a flashable
# AnyKernel3 ZIP.
#
# The whole integration is applied from a clean checkout by
# scripts/ksu-nova-setup.sh on every run, so nothing depends on a local working
# tree and the result is reproducible:
#
#   input (committed)                          applied at build time
#   --------------------------------------     -------------------------------
#   patches/susfs/susfs-4.14-v2.4.0.patch   -> fs/susfs.c, include/linux/susfs*.h,
#                                               fs/, mm/, security/ hook hunks
#   scripts/ksu-nova-setup.sh               -> SukiSU-Nova @ pinned commit,
#                                               drivers/kernelsu, KSU hooks,
#                                               defconfig symbols
#
# See docs/KSU-SUSFS.md for why those exact sources, and what is deliberately
# *not* wired (the legacy faccessat/stat su hooks, for instance).
#
# The build is untested on hardware: the job proves it compiles and that
# CONFIG_KSU / CONFIG_KSU_SUSFS actually survived into .config -- not that the
# resulting kernel boots on your device.

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: 'SukiSU-Nova ref (empty = pinned commit in scripts/ksu-nova-setup.sh)'
        required: false
        default: ''
      clang_repo:
        description: Prebuilt Clang/LLD repository
        required: true
        default: https://github.com/kdrag0n/proton-clang.git
      clang_ref:
        description: Branch or tag of the Clang repository
        required: true
        default: master
      target:
        description: Kernel make target
        required: true
        default: Image.gz-dtb
      release_tag:
        description: Optional tag for a GitHub Release (empty = artifact only)
        required: false
        default: ''
      no_polly:
        description: Disable CONFIG_LLVM_POLLY (needed for toolchains without Polly)
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    paths:
      - '.github/workflows/build-kernel-sukisu.yml'
      - 'scripts/ksu-nova-setup.sh'
      - 'scripts/build.sh'
      - 'scripts/package-anykernel.sh'
      - 'patches/susfs/**'
      - 'arch/arm64/configs/vendor/xiaomi/miatoll_defconfig'
      - 'anykernel3/**'
    tags:
      - 'skynet-17-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev cpio zip ccache python3 \
            gcc g++ make patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Fetch pinned Clang toolchain
        env:
          CLANG_REPO: ${{ inputs.clang_repo || 'https://github.com/kdrag0n/proton-clang.git' }}
          CLANG_REF: ${{ inputs.clang_ref || 'master' }}
        run: |
          git clone --depth 1 -b "$CLANG_REF" "$CLANG_REPO" "$HOME/clang"
          # A wrong repo/ref does not 404 here -- AOSP-style prebuilt
          # repositories happily serve empty version directories -- so verify
          # the tools exist instead of finding out 40 minutes later.
          "$HOME/clang/bin/clang" --version | head -n1
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip; do
            test -x "$HOME/clang/bin/$tool" \
              || { echo "::error::missing toolchain binary $tool"; exit 1; }
          done
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Apply SukiSU-Nova + SUSFS integration
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          chmod +x scripts/ksu-nova-setup.sh
          ./scripts/ksu-nova-setup.sh
          {
            echo "### SukiSU-Nova + SUSFS"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| SukiSU-Nova | \`$(git -C KernelSU rev-parse HEAD)\` |"
            echo "| SUSFS | \`$(sed -nE 's/.*SUSFS_VERSION[[:space:]]+"([^"]+)".*/\1/p' include/linux/susfs.h | head -n1)\` |"
            echo "| defconfig | \`$(grep -cE '^CONFIG_KSU_SUSFS[A-Z_0-9]*=y$' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig) SUSFS options\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect applied tree
        run: |
          echo "--- KSU wiring ---"
          ls -l drivers/kernelsu
          tail -2 drivers/Makefile
          grep -n 'kernelsu' drivers/Kconfig
          echo "--- KSU hooks ---"
          grep -c 'ksu_handle' fs/exec.c kernel/reboot.c kernel/sys.c drivers/input/input.c
          echo "--- SUSFS wiring ---"
          grep -n 'susfs' fs/Makefile
          grep -E '^#define SUSFS_VERSION' include/linux/susfs.h
          echo "--- defconfig ---"
          grep -E '^CONFIG_KSU' arch/arm64/configs/vendor/xiaomi/miatoll_defconfig

      - name: Verify in-tree source
        run: ./scripts/verify-source.sh

      - name: Configure and build
        env:
          TARGET: ${{ inputs.target || 'Image.gz-dtb' }}
          NO_POLLY: ${{ inputs.no_polly || 'true' }}
        run: |
          EXTRA=()
          if [ "$NO_POLLY" = "true" ]; then EXTRA+=(--no-polly); fi
          ./scripts/build.sh --clang-dir "$HOME/clang/bin" \
            --jobs "$(nproc)" --target "$TARGET" "${EXTRA[@]}"

          echo "--- CONFIG_KSU / SUSFS in generated .config ---"
          # An option whose Kconfig dependency is unmet is dropped silently by
          # olddefconfig, which is exactly how you end up shipping a kernel
          # that looks patched and hides nothing. Assert every symbol the
          # defconfig asks for actually made it.
          grep -E '^CONFIG_(KSU|KALLSYMS)' out/.config || {
            echo "::error::CONFIG_KSU did not survive into .config"; exit 1; }
          for sym in CONFIG_KSU CONFIG_KSU_SUSFS; do
            grep -qx "$sym=y" out/.config || {
              echo "::error::$sym is not =y in .config"; exit 1; }
          done
          while read -r sym; do
            grep -qx "$sym" out/.config || {
              echo "::error::defconfig symbol $sym was dropped from .config"; exit 1; }
          done < <(grep -E '^CONFIG_KSU_SUSFS[A-Z_0-9]*=y$' \
                     arch/arm64/configs/vendor/xiaomi/miatoll_defconfig)
          echo "all $(grep -cE '^CONFIG_KSU_SUSFS[A-Z_0-9]*=y$' out/.config) SUSFS options survived"

          echo "--- kernel.release ---"
          REL="$(cat out/include/config/kernel.release 2>/dev/null || printf 'unknown')"
          echo "$REL"
          case "$REL" in
            *SKYNET*) ;;
            *) echo "::error::kernel.release does not contain SKYNET: $REL"; exit 1 ;;
          esac
          echo "--- boot artefacts ---"
          ls -lh out/arch/arm64/boot/ || true

      - name: Package AnyKernel3 ZIP
        id: package
        run: |
          NAME="skynet-17-sukisu-nova-susfs-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          ./scripts/package-anykernel.sh --name "$NAME" \
            --out "$GITHUB_WORKSPACE/$NAME.zip"
          sha256sum "$NAME.zip" | tee "$NAME.zip.sha256"
          echo "zip=$NAME.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: skynet-kernel-sukisu-nova-susfs-zip
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: true
          body: |
            ## UNTESTED — hardware validation required

            Kernel with **SukiSU-Nova** (`builtin`, source-integrated) and
            **SUSFS v2.4.0** root hiding, built by
            `Build SKYNET kernel + SukiSU-Nova + SUSFS`.

            | item | value |
            | --- | --- |
            | SukiSU-Nova | committed in `scripts/ksu-nova-setup.sh` (`KSU_REF`) |
            | SUSFS | v2.4.0 (`patches/susfs/susfs-4.14-v2.4.0.patch`) |
            | source | `${{ github.sha }}` on `${{ github.ref_name }}` |

            **Not boot-tested on any miatoll device.** Back up `boot`, `dtbo`,
            `vendor_boot`, `recovery` and `persist` before flashing, verify the
            device codename and slot layout, and check the attached `.sha256`.

            Install the **SukiSU-Nova** manager — an older SukiSU Ultra manager
            will report "kernel update required".

            SUSFS needs a matching userspace module: use a `ksu_susfs` build
            that speaks the **v2.4.0** protocol. A v1.5.x module reports the
            kernel as unsupported.
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
